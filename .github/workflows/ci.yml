name: Native bindings
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOKOL_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select Clang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"MOON_CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Verify vendored sources
        run: python scripts/prepare.py --check
      - name: Verify Windows and non-Windows API visibility
        run: python scripts/check_platform_api.py
      - name: Check, test and verify public interfaces
        run: |
          moon version --all
          moon check --target all --warn-list +73
          moon test --target native
          moon test --target native --release
          moon info
          moon fmt --check
          moon fmt --check build.mbtx
      - name: Verify interface snapshots on non-Windows
        if: runner.os != 'Windows'
        run: git diff --exit-code
      - name: Verify interface snapshots on Windows
        if: runner.os == 'Windows'
        # These interfaces intentionally differ from the tracked non-Windows snapshot.
        run: git diff --exit-code -- . ':!app/pkg.generated.mbti' ':!gfx/pkg.generated.mbti'
      - name: Compile the production backend
        env:
          SOKOL_HEADLESS: "0"
        run: moon build --target native --release
      - name: Address and leak sanitizers
        if: runner.os == 'Linux'
        run: python scripts/run-asan.py
